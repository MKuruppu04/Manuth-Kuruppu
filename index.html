<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manuth Kuruppu | Biomedical Engineering Portfolio</title>
    <meta name="description" content="Portfolio of Manuth Kuruppu (Kuruppu K A M T) - Biomedical Engineering Undergraduate at University of Moratuwa specializing in biomedical instrumentation, analog circuits, and healthcare technology." />
    <meta property="og:title" content="Manuth Kuruppu | Biomedical Engineering Portfolio" />
    <meta property="og:description" content="Biomedical engineering student at University of Moratuwa developing autonomous clinical monitoring, phonocardiography, and microgravity research systems." />
    <meta name="theme-color" content="#08090a" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              obsidian: {
                950: '#040506',
                900: '#08090a',
                850: '#0e1113',
                800: '#14181b',
                700: '#1d2327',
                600: '#2c353b'
              },
              emerald: {
                400: '#34d399',
                500: '#10b981',
                600: '#059669',
                700: '#047857'
              }
            },
            fontFamily: {
              display: ['Syne', 'Plus Jakarta Sans', 'sans-serif'],
              sans: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace']
            }
          }
        }
      }
    </script>
    <style>
      html {
        scroll-behavior: smooth;
        scroll-padding-top: 80px;
        background-color: #08090a;
        color: #f1f5f9;
      }
      
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #08090a;
        color: #e2e8f0;
        overflow-x: hidden;
      }

      /* Custom scrollbars */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #08090a;
      }
      ::-webkit-scrollbar-thumb {
        background: #1d2327;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #10b981;
      }

      .tabular-nums {
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body class="bg-obsidian-900 text-slate-100 antialiased selection:bg-emerald-500/20 selection:text-emerald-300">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
